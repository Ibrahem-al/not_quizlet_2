<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyFlow — flashcards, study games, and spaced repetition that sync to the cloud and keep working offline" />
    <meta name="theme-color" content="#1b6ca8" />
    <meta property="og:title" content="StudyFlow" />
    <meta property="og:description" content="Flashcards, study games, and spaced repetition that sync to the cloud and keep working offline" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>StudyFlow</title>
    <script>
      // Prevent FOUC - apply theme before render
      (function() {
        try {
          const saved = localStorage.getItem('studyflow-theme');
          const dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
      // Apply the saved text size before render (keep in sync with useTextSizeStore)
      (function() {
        try {
          var scales = { sm: 0.875, md: 1, lg: 1.125, xl: 1.25, xxl: 1.375 };
          var size = localStorage.getItem('studyflow-text-size');
          if (size && scales[size]) {
            document.documentElement.style.setProperty('--sf-text-scale', String(scales[size]));
            document.documentElement.dataset.textSize = size;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
